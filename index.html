<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorry, Four 🐱</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center">
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card card-sorry text-center p-4 p-md-5">

        
        <div id="stepAsk">
          <div class="big-cat">🐱</div>
          <h1 class="mt-2">I’m sorry, Four 🥺</h1>

          <div class="gif-box my-3">
            
            <img id="catGif" src="sad-cat.gif" alt="sad cat"
                 onerror="this.outerHTML='<div class=&quot;big-cat&quot;>😿</div>'">
          </div>

          <p class="lead" id="msg">
            I know I messed up, and I really didn’t mean to hurt you.
            You matter a lot to me, and I hate that I made you upset. 🐾
          </p>

          <p class="fw-semibold mb-3">Can you forgive me? 😽</p>

          <div class="d-flex justify-content-center gap-3 flex-wrap">
            <button id="yesBtn" class="btn btn-success btn-lg rounded-pill px-4">Yes 😸</button>
            <button id="noBtn" class="btn btn-outline-danger btn-lg rounded-pill px-4">No 😾</button>
          </div>
          <p class="small text-muted mt-3" id="hint"></p>
        </div>

        
        <div id="stepYes" class="hidden">
          <div class="big-cat">😻</div>
          <h1 class="mt-2">Yayyy! Thank you, Four! 💜</h1>
          <div class="gif-box my-3">
 
            <img src="happy-cat.gif" alt="happy cat"
                 onerror="this.outerHTML='<div class=&quot;big-cat&quot;>😻🎉</div>'">
          </div>
          <p class="lead">I promise to be better. You’re the best, and I’m really lucky to have you 🐱✨</p>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
